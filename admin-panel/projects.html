<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JKWI Projects Management</title>

<link rel="stylesheet" href="../frontend/css/style.css">

</head>


<body>


<header>

<nav class="navbar">


<div class="logo">

<img src="../frontend/images/logo/jkwi-logo.png" alt="JKWI Logo">

</div>


<h2>
Projects Management
</h2>


</nav>

</header>





<section class="about">


<h2>
Create New Project
</h2>


<form class="project-form">


<input 
type="text"
placeholder="Project Name"
>


<select>

<option>
Mining
</option>

<option>
Farming
</option>

<option>
Finance
</option>

<option>
Infrastructure
</option>

<option>
Social Development
</option>

<option>
Legal
</option>

<option>
Professional Services
</option>

<option>
Media
</option>

</select>



<textarea 
placeholder="Project Description">
</textarea>



<input
type="number"
placeholder="Minimum Investment Amount"
>



<button class="button">
Add Project
</button>


</form>


</section>






<section class="divisions">


<h2>
Active Projects
</h2>


<div class="division-container">



<div class="division-card">


<h3>
Example Mining Project
</h3>


<p>
Division: Mining
</p>


<p>
Status: Active
</p>


<button class="button">
Manage
</button>


</div>




<div class="division-card">


<h3>
Example Farming Project
</h3>


<p>
Division: Farming
</p>


<p>
Status: Active
</p>


<button class="button">
Manage
</button>


</div>



</div>


</section>






<footer>

<h3>
JK Winners Investment (Pty) Ltd
</h3>

<p>
Admin Management System
</p>

</footer>


</body>

</html>
