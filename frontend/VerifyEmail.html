<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Your Email | JK Winners Investment</title>
    <link rel="stylesheet" href="css/verify-email.css">
</head>
<body>
    <main class="verify-page">
        <section class="verify-card">
            <img src="images/logo.png" alt="JK Winners Investment" class="verify-logo">
            <h1>Verify Your Email</h1>
            <p class="subtitle">We've sent a 6-digit code to <strong id="emailDisplay"></strong>. Please enter it below.</p>

            <form id="verifyForm" novalidate>
                <label for="verificationCode">Verification code</label>
                <input id="verificationCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required>
                <small id="codeError" class="field-error"></small>
                <button id="confirmButton" type="submit">Confirm Email</button>
            </form>

            <div id="message" class="message" aria-live="polite"></div>
            <button id="resendButton" type="button" class="resend-button" disabled>Resend Code <span id="countdown">(60s)</span></button>
            <p class="login-link"><a href="login.html">Back to Login</a></p>
        </section>
    </main>
    <script src="js/verify-email.js"></script>
</body>
</html>
