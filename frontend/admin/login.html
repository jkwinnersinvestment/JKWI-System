<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JKWI Admin Login</title>

    <link
        rel="stylesheet"
        href="../css/admin-login.css"
    >

</head>


<body>

    <main class="login-page">

        <div class="login-card">


            <!-- =====================================
                 LOGO
            ====================================== -->

            <div class="login-logo">

                <img
                    src="../images/logo.png"
                    alt="JK Winners Investment"
                >

            </div>


            <!-- =====================================
                 HEADING
            ====================================== -->

            <div class="login-heading">

                <span>
                    JK WINNERS INVESTMENT
                </span>

                <h1>
                    Admin Login
                </h1>

                <p>
                    Sign in to manage the JKWI platform.
                </p>

            </div>


            <!-- =====================================
                 LOGIN FORM
            ====================================== -->

            <form id="loginForm">


                <!-- USERNAME -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    id="loginButton"
                >
                    Sign In
                </button>


                <!-- MESSAGE -->

                <p
                    id="loginMessage"
                    class="login-message"
                    aria-live="polite"
                ></p>


            </form>


            <!-- =====================================
                 BACK TO WEBSITE
            ====================================== -->

            <a
                href="../index.html"
                class="back-home"
            >
                ← Back to Website
            </a>


        </div>

    </main>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="../js/admin-login.js"></script>


</body>

</html>
