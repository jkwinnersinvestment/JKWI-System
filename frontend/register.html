<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | JK Winners Investment</title>

    <link
        rel="stylesheet"
        href="css/register.css"
    >
</head>

<body>

    <main class="register-page">

        <section class="register-card">

            <!-- LOGO -->

            <img
                src="assets/images/jkwi-logo.png"
                alt="JK Winners Investment"
                class="jkwi-logo"
            >


            <h1>Create Account</h1>

            <p class="subtitle">
                Join JK Winners Investment
            </p>


            <!-- ACCOUNT TYPE -->

            <div class="account-types">

                <button
                    type="button"
                    class="account-type active"
                    data-type="customer"
                >
                    Customer
                </button>

                <button
                    type="button"
                    class="account-type"
                    data-type="worker"
                >
                    Worker
                </button>

                <button
                    type="button"
                    class="account-type"
                    data-type="partner"
                >
                    Partner
                </button>

            </div>


            <form id="registerForm">

                <input
                    type="hidden"
                    id="accountType"
                    value="customer"
                >


                <div class="name-row">

                    <div class="field">

                        <label>
                            First Name
                        </label>

                        <input
                            id="firstName"
                            type="text"
                            autocomplete="given-name"
                            required
                        >

                    </div>


                    <div class="field">

                        <label>
                            Last Name
                        </label>

                        <input
                            id="lastName"
                            type="text"
                            autocomplete="family-name"
                            required
                        >

                    </div>

                </div>


                <div class="field">

                    <label>
                        Email
                    </label>

                    <input
                        id="email"
                        type="email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="field">

                    <label>
                        Phone Number
                    </label>

                    <input
                        id="phone"
                        type="tel"
                        inputmode="tel"
                        autocomplete="tel"
                        required
                    >

                </div>


                <div class="name-row">

                    <div class="field">

                        <label>
                            Password
                        </label>

                        <input
                            id="password"
                            type="password"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                    </div>


                    <div class="field">

                        <label>
                            Confirm
                        </label>

                        <input
                            id="confirmPassword"
                            type="password"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                    </div>

                </div>


                <div
                    id="message"
                    class="message"
                ></div>


                <button
                    id="registerButton"
                    type="submit"
                >
                    Create Account
                </button>

            </form>


            <p class="login-link">

                Already registered?

                <a href="login.html">
                    Sign in
                </a>

            </p>

        </section>

    </main>


    <script src="js/register.js"></script>

</body>

</html>
